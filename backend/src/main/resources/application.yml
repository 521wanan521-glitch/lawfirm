spring:
  application:
    name: lawfirm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 应用自定义配置
app:
  jwt:
    # 生产环境务必通过环境变量 APP_JWT_SECRET 覆盖（至少 32 字符）
    secret: ${APP_JWT_SECRET:LawFirmSystemDefaultSecretKeyChangeMeInProduction2024!}
    # 令牌有效期（毫秒），默认 12 小时
    expire-ms: ${APP_JWT_EXPIRE_MS:43200000}
  upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
  deepseek:
    # DeepSeek API Key（环境变量 DEEPSEEK_API_KEY 注入，必填）
    api-key: ${DEEPSEEK_API_KEY:}
    # OpenAI 兼容接口地址
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # deepseek-chat 支持工具调用；deepseek-reasoner 不支持 function calling
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    max-tool-rounds: ${DEEPSEEK_MAX_TOOL_ROUNDS:6}

---
# 开发环境：H2 内存数据库，开箱即用
spring:
  config:
    activate:
      on-profile: dev
  profiles:
    include: local
  datasource:
    url: jdbc:h2:file:./data/lawfirm-dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
# 生产环境：PostgreSQL（Docker 部署使用）
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lawfirm}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:lawfirm}
    password: ${DB_PASSWORD:lawfirm}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.lawfirm: ${LOG_LEVEL:info}
