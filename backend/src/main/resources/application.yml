spring:
  application:
    name: lawfirm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  security:
    filter:
      # 安全过滤器仅作用于初始请求；跳过 ASYNC 收尾分发，
      # 否则 SseEmitter 完成时的 async dispatch 会因认证上下文未恢复而 403，导致流式响应被截断
      dispatcher-types: request, error
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # 文件上传大小限制（默认仅 1MB，会导致多页文档上传失败）
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 应用自定义配置
app:
  jwt:
    # 无默认回退值：生产环境必须通过 APP_JWT_SECRET 注入（至少 32 字符），否则启动失败
    secret: ${APP_JWT_SECRET:}
    # 令牌有效期（毫秒），默认 12 小时
    expire-ms: ${APP_JWT_EXPIRE_MS:43200000}
  upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
  deepseek:
    # DeepSeek API Key（环境变量 DEEPSEEK_API_KEY 注入，必填）
    api-key: ${DEEPSEEK_API_KEY:}
    # OpenAI 兼容接口地址
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # deepseek-chat 支持工具调用；deepseek-reasoner 不支持 function calling
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    max-tool-rounds: ${DEEPSEEK_MAX_TOOL_ROUNDS:6}
  # 联网搜索（AI 助手 search_web 工具，免注册多引擎方案）
  web-search:
    enabled: ${WEB_SEARCH_ENABLED:true}
    # 搜索源顺序（前面的优先）：sogou / bing / duckduckgo
    engines: ${WEB_SEARCH_ENGINES:sogou,bing,duckduckgo}
    max-results: ${WEB_SEARCH_MAX_RESULTS:5}
    timeout-seconds: ${WEB_SEARCH_TIMEOUT_SECONDS:12}

---
# 开发环境：H2 内存数据库，开箱即用
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/lawfirm-dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;AUTO_SERVER_PORT=${H2_AUTO_SERVER_PORT:9092}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# 开发环境专用 JWT 密钥（仅本地开发回退；生产必须用 APP_JWT_SECRET 注入）
app:
  jwt:
    secret: ${APP_JWT_SECRET:lawfirm-dev-only-jwt-secret-0123456789abcdef0123456789abcdef}

---
# 生产环境：PostgreSQL（Docker 部署使用）
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lawfirm}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:lawfirm}
    password: ${DB_PASSWORD:lawfirm}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.lawfirm: ${LOG_LEVEL:info}
