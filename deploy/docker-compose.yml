version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: lawfirm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lawfirm}
      POSTGRES_USER: ${DB_USER:-lawfirm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lawfirm-change-me}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lawfirm} -d ${DB_NAME:-lawfirm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lawfirm-net

  backend:
    build:
      context: ../backend
    container_name: lawfirm-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-lawfirm}
      DB_USER: ${DB_USER:-lawfirm}
      DB_PASSWORD: ${DB_PASSWORD:-lawfirm-change-me}
      # 生产环境务必设置为强随机密钥（至少 32 字符）
      APP_JWT_SECRET: ${APP_JWT_SECRET:?请设置 APP_JWT_SECRET 环境变量}
      APP_UPLOAD_DIR: /data/uploads
      # DeepSeek 大模型（AI 助手），可选：留空则 AI 助手功能不可用
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # 小内存服务器（≤2G）运行时 JVM 限制
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:MaxMetaspaceSize=256m"
      TZ: Asia/Shanghai
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lawfirm-net

  frontend:
    build:
      context: ../frontend
    container_name: lawfirm-frontend
    restart: unless-stopped
    ports:
      # 默认 80；若宿主机 80 被占用，在 .env 中设置 FRONTEND_PORT=8088 等
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - lawfirm-net

volumes:
  pgdata:
  uploads:

networks:
  lawfirm-net:
